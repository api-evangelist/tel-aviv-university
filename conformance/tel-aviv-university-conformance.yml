method: probed
source: >-
  Live probes of every Tel Aviv University surface on 2026-08-30 (OAI-PMH Identify /
  ListMetadataFormats / ListSets / ListRecords, SRU explain, SAML metadata retrieval, eduGAIN
  entity database). No specification document was available to read conformance from, because
