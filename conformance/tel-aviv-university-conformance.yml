docs: https://en-libraries.tau.ac.il/
note: >-
  Conformance is scored against the Kin Score `education` regulatory regime's standards[].
  IMPORTANT: every conforming surface below carries x-operator `tenant` — the protocol
  implementation belongs to Ex Libris, Elsevier or IUCC, and only the records and the scope value
