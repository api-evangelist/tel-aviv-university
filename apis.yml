    vendor deployment under the institution's name — a tenant relationship — rather than an
    institution-operated service. The OAI-PMH endpoint itself is live and keyless (verified
    2026-08-30) and serves seven metadata prefixes (oai_dc, qdc, mods, mods_swepub, nl_didl,
