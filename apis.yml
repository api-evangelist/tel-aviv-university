description: >-
  Tel Aviv University (TAU / אוניברסיטת תל אביב) is Israel's largest university, a public
  research institution in Tel Aviv with roughly 30,000 students across nine faculties, and a
  member of the Israeli research-university group served by the Inter-University Computation
  Center (IUCC). Re-profiled on 2026-08-30 with operator attribution settled before any artifact
  was saved: TAU operates NO central developer portal, NO open-data portal and NO
  institution-operated public API. api.tau.ac.il, developer.tau.ac.il, opendata.tau.ac.il and
  services.tau.ac.il do not resolve; data.tau.ac.il and digital.tau.ac.il resolve only as vanity
  redirects. Every machine-readable, callable surface TAU has is a vendor product deployed under
  the institution's name and is recorded here as a TENANT relationship, not as TAU engineering:
  the Ex Libris Alma OAI-PMH 2.0 service and SRU 1.2 search service for the library record, the
  Ex Libris Primo VE discovery layer (institution code 972TAU_INST:TAU, branded "DaTA Search"),
  the Elsevier Pure CRIS at cris.tau.ac.il whose OAI-PMH endpoint self-identifies as "Pure OAI
  Repository" administered from purehosted@elsevier.com, and TAU's SAML identity, which is a
  tau.ac.il scope on the IUCC national proxy identity provider in eduGAIN rather than a TAU-
  registered entity of its own. The only machine-readable documents TAU itself serves from its
  own hosts are the Drupal RSS 2.0 news feeds at www.tau.ac.il/rss.xml and
  english.tau.ac.il/rss.xml, and its public timetable and course search at
  www.ims.tau.ac.il/Tal/KR/Search_P.aspx is an HTML form with no API behind it. TAU publishes an
  institutional generative-AI guidance set for students and faculty through its Deanery for
  Innovation in Teaching and Learning. There is no official institution-wide GitHub organisation;
  code lives in lab and student-club orgs.
