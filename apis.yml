    Tel Aviv University's current research information system is Elsevier Pure, published as the
    TAU Research Portal at cris.tau.ac.il. The host sits on TAU's own registrable domain but
    CNAMEs to telaviv.elsevierpure.com and then to eu.prod.elsevierpure.com, and the deployment
