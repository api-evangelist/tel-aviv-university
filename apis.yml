  detail: >-
    Every surface class the university pipeline hunts was probed on 2026-08-30 and Tel Aviv
    University operates no institution-owned public API. A 90-name DNS sweep of tau.ac.il found
    no api., developer., opendata., services., swagger., graphql. or rest. host; data.tau.ac.il
    and digital.tau.ac.il exist only as vanity redirects (data. lands on the Ex Libris Primo
    tenant). dspace.tau.ac.il and idp.tau.ac.il resolve to campus addresses but refuse
    connections on 80 and 443 from the public internet, so neither is a public surface. The
    library and research surfaces are all real and all tenant: Alma OAI-PMH 2.0 and SRU 1.2 on
    tau.alma.exlibrisgroup.com (both live, keyless, verified), Primo VE discovery on
    tau.primo.exlibrisgroup.com, and the Elsevier Pure CRIS at cris.tau.ac.il whose OAI-PMH
    Identify names "Pure OAI Repository" and purehosted@elsevier.com — an Elsevier-hosted
    deployment on a TAU-branded CNAME, not TAU engineering. Its Pure Web Service returns 401
    without an institution key and cris.tau.ac.il/en/datasets/ is behind a Cloudflare interstitial
    (HTTP 403), while the /ws/oai path is unchallenged. Identity federation is a real find and a
    negative one: TAU has no eduGAIN-registered entity, only a tau.ac.il shibMD:Scope on the IUCC
    national proxy IdP. The only machine-readable documents TAU serves from its own hosts are two
    Drupal RSS 2.0 feeds (www.tau.ac.il/rss.xml, english.tau.ac.il/rss.xml, both 200 and
    populated); the public course search at www.ims.tau.ac.il/Tal/KR/Search_P.aspx is an HTML
    form that POSTs to Search_L.aspx and returns HTML. No llms.txt, no /.well-known/security.txt,
    no apis.json and no sitemap.xml are served. Two entries carried by the June 2026 profile were
    removed in this run as misattributions rather than gaps: an "Alma / OAI-PMH" entry whose only
    URL was Ex Libris's own generic vendor documentation, now re-based on the real live TAU
    tenant endpoint; and an "Unofficial tau-tools" API entry plus a GitHubOrganization pointer at
    github.com/arazimproject — a student club's credential-scraping Python library that badges
    itself "tau-unofficial" and is neither operated nor endorsed by the university. It is
    documented in review.yml and is deliberately not credited as a TAU surface.
