  - date: '2026-08-30'
    rating: 2
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which settles WHO OPERATES each
      surface before any artifact is saved. Verdict unchanged in substance and sharper in detail:
      Tel Aviv University operates no institution-owned public API. A 90-name DNS sweep of
      tau.ac.il found no api./developer./opendata./services./graphql./swagger. host; dspace and
      idp resolve to campus addresses but refuse public connections. Every callable surface is a
      tenant deployment and is now recorded as one, with live keyless endpoints found for the
      first time: Ex Libris Alma OAI-PMH 2.0 and SRU 1.2 on tau.alma.exlibrisgroup.com, and the
      Elsevier Pure CRIS OAI-PMH at cris.tau.ac.il/ws/oai. The June 2026 profile's "Alma /
      OAI-PMH" entry pointed only at Ex Libris's generic vendor documentation and has been
      re-based on TAU's real tenant endpoint. Identity federation is a real find and a negative
      one: TAU publishes no eduGAIN-registered entity, only a tau.ac.il shibMD:Scope on IUCC's
      national proxy IdP. Two June entries were removed as misattributions: the "Unofficial
      tau-tools" API entry and the GitHubOrganization pointer at github.com/arazimproject. That
      project is a student club's Python library that logs in with a student's own credentials
      and scrapes Moodle and IMS, badges itself "tau-unofficial", and is neither operated nor
      endorsed by the university; crediting it to TAU inflated the institution's footprint with
      someone else's engineering. It remains documented here and is deliberately not listed as a
      TAU surface. There is no official institution-wide GitHub organisation (a GitHub org search
      returns only lab and student orgs). Rated 2 (tenant-only: real records, vendor contracts).
